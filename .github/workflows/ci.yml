name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python 3.12 — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -c requirements/constraints-py312.txt -e ".[dev]"
      - name: Run complete verification
        run: python scripts/verify.py
      - name: Run safe Windows integration check
        if: runner.os == 'Windows'
        env:
          SHURI_RUN_WINDOWS_INTEGRATION: "1"
        run: python -m pytest tests/integration -m windows_integration
      - name: Install standalone build tool
        if: runner.os == 'Windows'
        run: python -m pip install -c requirements/constraints-py312.txt -e ".[standalone]"
      - name: Build and smoke-test standalone Windows executable
        if: runner.os == 'Windows'
        run: python scripts/build_standalone.py
      - name: Upload standalone Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: shuri-windows-x64
          path: dist/standalone/shuri.exe
          if-no-files-found: error
