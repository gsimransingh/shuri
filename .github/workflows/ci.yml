name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python 3.12 — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -c requirements/constraints-py312.txt -e ".[dev]"
      - name: Run complete verification
        run: python scripts/verify.py
      - name: Run safe Windows integration check
        if: runner.os == 'Windows'
        env:
          SHURI_RUN_WINDOWS_INTEGRATION: "1"
        run: python -m pytest tests/integration -m windows_integration
      - name: Run safe Linux and macOS integration checks
        if: runner.os != 'Windows'
        env:
          SHURI_RUN_NATIVE_INTEGRATION: "1"
        run: python -m pytest tests/integration -m native_integration
      - name: Install standalone build tool
        run: python -m pip install -c requirements/constraints-py312.txt -e ".[standalone]"
      - name: Build and smoke-test standalone executable
        run: python scripts/build_standalone.py
      - name: Upload standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: shuri-${{ runner.os }}-${{ runner.arch }}
          path: dist/standalone/shuri*
          if-no-files-found: error

  linux-distributions:
    name: Native Linux — ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 24.04
            image: ubuntu:24.04
            family: debian
          - distribution: Debian 12
            image: debian:12
            family: debian
          - distribution: Fedora 42
            image: fedora:42
            family: fedora
          - distribution: Arch Linux
            image: archlinux:latest
            family: arch
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Run installed-command and native-collector checks
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          "${{ matrix.image }}"
          sh scripts/test_linux_distribution.sh "${{ matrix.family }}"
