name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python 3.12 — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/lock-py312.txt
      - name: Install project
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run complete verification
        run: python scripts/verify.py
      - name: Run safe Windows integration check
        if: runner.os == 'Windows'
        env:
          SHURI_RUN_WINDOWS_INTEGRATION: "1"
        run: python -m pytest tests/integration -m windows_integration

  audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Audit the locked dependency set
        run: |
          python -m pip install pip-audit
          python -m pip_audit --require-hashes --disable-pip -r requirements/lock-py312.txt
